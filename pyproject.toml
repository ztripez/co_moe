[project]
name = "co-moe"
version = "0.1.0"
description = "Causal experiments with frozen experts from independently pretrained MoE models"
requires-python = ">=3.12"
dependencies = ["torch", "transformers", "safetensors", "huggingface-hub", "httpx", "pydantic"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
